<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>RAG 問答助理</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/base.css" />
    <link rel="stylesheet" href="/assets/production.css" />
  </head>
  <body>
    <section class="auth-gate" id="authGate" hidden>
      <div class="auth-gate-content">
        <h1>歡迎使用</h1>
        <p>登入後即可使用知識庫、文件與對話紀錄。</p>
        <a class="primary-command" href="/auth/login">登入</a>
      </div>
    </section>

    <main class="app-shell production-shell" id="appShell" hidden>
      <aside class="conversation-rail is-collapsed" id="conversationRail" aria-label="對話紀錄">
        <div class="rail-icons">
          <button class="rail-icon-button" id="historyToggle" type="button" title="對話紀錄" aria-label="展開對話紀錄">
            <span class="collapse-icon" aria-hidden="true"><span></span><span></span></span>
          </button>
        </div>
        <div class="rail-content">
          <div class="rail-content-head">
            <strong>對話紀錄</strong>
            <div class="rail-head-actions">
              <button class="new-chat-button" id="newChatButton" type="button" title="新增對話" aria-label="新增對話">＋</button>
              <button class="panel-close-button" id="historyClose" type="button" aria-label="收合對話紀錄">×</button>
            </div>
          </div>
          <nav class="conversation-list" id="conversationList" aria-label="已儲存的對話"></nav>
        </div>
      </aside>

      <section class="main-area">
        <header class="topbar production-topbar">
          <span class="plan-pill" id="dataStatus">正在載入</span>
          <div class="topbar-actions">
            <button class="text-command" id="logoutButton" type="button">登出</button>
            <button class="icon-button" id="knowledgeToggle" type="button" aria-label="展開文件選擇" title="文件">☷</button>
          </div>
        </header>

        <section class="chat-pane" aria-label="RAG 對話">
          <div class="chat-scroll" id="chatScroll">
            <section class="home-panel" id="homePanel">
              <h1>歡迎使用</h1>
              <p id="homeHint">選擇知識庫後即可開始提問</p>
              <button class="secondary-command" id="createKnowledgeBaseButton" type="button" hidden>新增知識庫</button>
            </section>
            <section class="conversation-transcript" id="conversationTranscript" aria-live="polite" hidden></section>
            <section class="assistant-message search-progress" id="searchProgress" aria-live="polite" hidden>
              <div class="avatar progress-avatar">AI</div>
              <div class="message-body">
                <p class="message-label">處理進度</p>
                <div class="progress-steps" id="searchProgressSteps"></div>
              </div>
            </section>
          </div>

          <div class="prompt-dock">
            <form id="searchForm" class="prompt-card production-prompt" aria-label="輸入問題">
              <textarea id="queryInput" rows="1" autocomplete="off" placeholder="輸入問題"></textarea>
              <div class="prompt-footer">
                <label class="model-picker">
                  <select id="qaModelSelect" aria-label="問答模型"></select>
                </label>
                <button class="send-button" id="sendButton" type="submit" aria-label="送出">↑</button>
              </div>
            </form>
          </div>
        </section>
      </section>

      <aside class="knowledge-panel is-collapsed" id="knowledgePanel" aria-label="知識庫與文件">
        <div class="knowledge-content">
          <div class="knowledge-panel-head">
            <strong>文件</strong>
            <button class="panel-close-button" id="knowledgeClose" type="button" aria-label="收合文件選擇">×</button>
          </div>
          <div class="top-actions production-kb-controls">
            <label class="language-picker">
              <span>語言</span>
              <select id="languageSelect">
                <option value="zh-Hant" selected>中文</option>
                <option value="en">English</option>
              </select>
            </label>
            <label class="kb-picker">
              <span>知識庫</span>
              <select id="knowledgeBaseSelect" aria-label="知識庫"></select>
            </label>
          </div>
          <label class="file-search">
            <span aria-hidden="true">⌕</span>
            <input id="fileSearchInput" type="search" autocomplete="off" placeholder="搜尋文件名稱" />
          </label>
          <div class="folder-toolbar">
            <label class="upload-folder-picker">
              <span>上傳到</span>
              <select id="uploadFolderSelect" aria-label="上傳目的資料夾"></select>
            </label>
            <div class="folder-actions" aria-label="資料夾管理">
              <button id="newFolderButton" type="button" title="新增資料夾" aria-label="新增資料夾">＋</button>
              <button id="renameFolderButton" type="button" title="重新命名資料夾" aria-label="重新命名資料夾">✎</button>
              <button id="deleteFolderButton" type="button" title="刪除資料夾" aria-label="刪除資料夾">⌫</button>
            </div>
          </div>
          <p class="upload-status" id="documentUploadStatus" role="status" hidden></p>
          <section class="file-list-section" id="fileListSection">
            <div class="file-list-head">
              <h2>文件列表 <span id="selectedDocCount">(0)</span></h2>
              <div class="doc-actions">
                <input id="documentInput" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff,.bmp,.heic,.docx,.txt,.md,.markdown,.json" multiple hidden />
                <button class="upload-document-button" type="button" id="uploadDocument" title="上傳文件" aria-label="上傳文件">↑</button>
                <button type="button" id="selectAllDocuments">全選</button>
                <button type="button" id="clearDocuments">清除</button>
              </div>
            </div>
            <div class="document-list production-document-list" id="documentList"></div>
          </section>
          <div class="index-publish-bar">
            <p id="indexSummary">尚未選擇文件</p>
            <button class="primary-command" id="publishIndexButton" type="button">更新知識庫</button>
          </div>
        </div>
      </aside>
    </main>

    <dialog class="details-dialog" id="ragDetailsDialog" aria-labelledby="ragDetailsTitle">
      <div class="details-dialog-head">
        <div>
          <p>RAG 執行紀錄</p>
          <h2 id="ragDetailsTitle">檢索來源</h2>
        </div>
        <button class="panel-close-button" id="closeRagDetails" type="button" aria-label="關閉">×</button>
      </div>
      <div id="ragDetailsBody"></div>
    </dialog>

    <p class="app-toast" id="appToast" role="alert" hidden></p>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
