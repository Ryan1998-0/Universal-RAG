name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Validate dependency environment
        run: python -m pip check
      - name: Validate Python entry points
        run: python -m py_compile rag_demo/production/*.py rag_demo/worker/*.py scripts/*.py
      - name: Run Python regression suite
        run: python -m pytest -q
      - name: Validate migrations
        run: |
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic history
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run browser client tests
        run: node --test tests/frontend/*.test.mjs tests/ifrs17-demo/*.test.mjs
      - name: Validate shell scripts
        run: bash -n scripts/*.sh

  container-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_DOMAIN: rag.example.com
      ACME_EMAIL: admin@example.com
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      QDRANT_API_KEY: ci-qdrant-api-key
      S3_ACCESS_KEY_ID: ci-s3-access-key
      S3_SECRET_ACCESS_KEY: ci-s3-secret-key
      RAG_OIDC_ISSUER: https://identity.example.com/
      RAG_OIDC_AUDIENCE: ifrs17-rag-api
      RAG_OIDC_JWKS_URL: https://identity.example.com/.well-known/jwks.json
      RAG_OIDC_AUTHORIZATION_URL: https://identity.example.com/oauth2/authorize
      RAG_OIDC_TOKEN_URL: https://identity.example.com/oauth2/token
      RAG_OIDC_CLIENT_ID: ifrs17-rag-web
      RAG_OIDC_CLIENT_SECRET: ci-client-secret
      RAG_CORS_ORIGINS: https://rag.example.com
      RAG_OLLAMA_URL: https://inference.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose rendering
        run: docker compose -f compose.yaml config --quiet
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ifrs17-rag:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: ifrs17-rag-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
