<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>泛用 RAG 工作台</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
        color: #30343b;
        background: #f7f7f5;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main {
        width: min(880px, calc(100% - 40px));
        margin: 12vh auto;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 42px;
        font-weight: 500;
        letter-spacing: 0;
      }
      p {
        max-width: 680px;
        margin: 0;
        color: #656b73;
        font-size: 17px;
        line-height: 1.7;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }
      a {
        border: 1px solid #d5d7da;
        border-radius: 6px;
        padding: 11px 15px;
        background: #fff;
        color: #30343b;
        text-decoration: none;
      }
      a.primary {
        border-color: #4f5660;
        background: #4f5660;
        color: #fff;
      }
      .note {
        margin-top: 30px;
        font-size: 14px;
      }
      @media (max-width: 600px) {
        main { margin: 64px auto; }
        h1 { font-size: 34px; }
        nav { align-items: stretch; flex-direction: column; }
        a { text-align: center; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>泛用 RAG 工作台</h1>
      <p>
        支援多格式文件匯入、自適應路由、BM25 與 Embedding 混合檢索、
        Rerank、來源引用及本機模型。知識庫可自由替換，不綁定特定領域。
      </p>
      <nav aria-label="專案連結">
        <a class="primary" href="./rag-demo/">開啟介面展示</a>
        <a href="https://github.com/Ryan1998-0/Universal-RAG">查看原始碼</a>
        <a href="./project_overview_zh.md">閱讀架構說明</a>
      </nav>
      <p class="note">線上版本僅展示介面；完整文件處理與問答需啟動本機或正式後端。</p>
    </main>
  </body>
</html>
