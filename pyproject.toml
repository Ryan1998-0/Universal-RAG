[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-rag"
version = "0.2.0"
description = "支援多格式文件、混合檢索與可驗證引用的泛用 RAG 服務。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.140.0",
  "httpx==0.28.1",
  "numpy==2.5.1",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "PyJWT[crypto]==2.13.0",
  "pypdf==6.14.2",
  "qdrant-client==1.18.0",
  "sentence-transformers==5.6.1",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
langchain = [
  "langchain==1.4.0",
  "langchain-anthropic==1.7.2",
  "langchain-ollama==1.1.0",
  "langchain-openai==1.6.2",
]
production = [
  "boto3==1.43.56",
  "celery[redis]==5.6.3",
  "fastembed==0.8.0",
  "prometheus-client==0.23.1",
  "python-json-logger==4.0.0",
  "python-multipart==0.0.22",
]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]
evaluation = [
  "pillow==12.3.0",
  "python-docx==1.2.0",
  "reportlab==4.4.10",
]

[tool.setuptools.packages.find]
include = ["rag_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
