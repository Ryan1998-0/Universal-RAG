<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge Chat Demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./assets/styles.css?v=document-folders-1" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="conversation-rail is-collapsed" id="conversationRail" aria-label="Conversation history">
        <div class="rail-icons" aria-label="Main navigation">
          <button class="rail-icon-button" id="historyToggle" type="button" title="對話紀錄" aria-label="展開對話紀錄">
            <span class="collapse-icon" aria-hidden="true"><span></span><span></span></span>
          </button>
        </div>
        <div class="rail-content">
          <div class="rail-content-head">
            <strong>對話紀錄</strong>
            <div class="rail-head-actions">
              <button class="new-chat-button" id="newChatButton" type="button" title="新增對話" aria-label="新增對話">＋</button>
              <button class="panel-close-button" id="historyClose" type="button" aria-label="收合對話紀錄">×</button>
            </div>
          </div>
          <nav class="conversation-list" id="conversationList" aria-label="Saved conversations"></nav>
        </div>
      </aside>

      <section class="main-area">
        <header class="topbar">
          <div class="plan-pill"><span id="dataStatus">Loading profile...</span></div>
          <button class="icon-button" id="knowledgeToggle" type="button" aria-label="展開文件選擇">☷</button>
        </header>

        <section class="chat-pane" aria-label="RAG chat">
          <div class="chat-scroll">
            <section class="home-panel" id="homePanel">
              <h1>歡迎使用</h1>
              <div class="chips" id="questionChips"></div>
              <button class="demo-cta" id="demoCta" type="button">↑ 點擊查看模擬回覆</button>
            </section>

            <section class="conversation-transcript" id="conversationTranscript" aria-label="目前對話" hidden></section>

            <section class="user-message" id="userMessage" hidden>
              <p id="userQuestion"></p>
            </section>

            <section class="assistant-message search-progress" id="searchProgress" aria-live="polite" hidden>
              <div class="avatar progress-avatar">AI</div>
              <div class="message-body">
                <p class="message-label">處理進度</p>
                <div class="progress-steps" id="searchProgressSteps"></div>
              </div>
            </section>

            <section class="assistant-message status-message" id="statusMessage" hidden>
              <div class="avatar">KB</div>
              <div class="message-body">
                <p class="message-label" data-i18n="data">資料</p>
                <p id="dataMeta">Static GitHub Pages build</p>
                <div class="metrics" id="metrics"></div>
              </div>
            </section>

            <section class="assistant-message" id="answerMessage" hidden>
              <div class="avatar">A</div>
              <div class="message-body">
                <div class="message-head">
                  <div>
                    <p class="message-label" data-i18n="answer">回答</p>
                    <h2 id="resultTitle"></h2>
                  </div>
                  <span class="confidence" id="confidenceBadge"></span>
                </div>
                <div class="answer-panel" id="answerPanel"></div>
                <div class="agent-answer-panel" id="agentAnswerPanel"></div>
              </div>
            </section>

            <div class="rag-details-guide" id="ragDetailsGuide" hidden>
              <button id="ragDetailsToggle" type="button" aria-expanded="false">
                查看檢索過程與來源 →
              </button>
            </div>

            <section class="assistant-message" id="evidenceMessage" hidden>
              <div class="avatar">EV</div>
              <div class="message-body">
                <div class="message-head">
                  <div>
                    <p class="message-label" data-i18n="retrievedEvidence">檢索證據</p>
                    <h2 data-i18n="retrievedInfo">檢索到的相關資訊</h2>
                  </div>
                  <a class="trace-link" id="traceDocumentLink" href="#" target="_blank" rel="noopener" hidden>
                    開啟本次 RAG 紀錄
                  </a>
                </div>
                <div class="comparison-panel" id="comparisonPanel" hidden></div>
                <div class="results" id="results"></div>
              </div>
            </section>

            <section class="assistant-message" id="ragTrace" hidden>
              <div class="avatar">TR</div>
              <div class="message-body">
                <div class="message-head">
                  <div>
                    <p class="message-label" data-i18n="runTrace">執行紀錄</p>
                    <h2 data-i18n="traceTitle">本次 RAG 節點紀錄</h2>
                  </div>
                  <span class="run-id" id="runId"></span>
                </div>
                <div class="trace-summary" id="traceSummary"></div>
                <ol class="pipeline" id="pipeline"></ol>
              </div>
            </section>
          </div>

          <div class="prompt-dock">
            <form id="searchForm" class="prompt-card" aria-label="Ask question">
              <textarea
                id="queryInput"
                name="query"
                rows="2"
                autocomplete="off"
                placeholder="輸入問題"
              ></textarea>
              <div class="prompt-footer">
                <label class="model-picker">
                  <select id="qaModelSelect" aria-label="QA model"></select>
                </label>
                <div class="prompt-tools" aria-label="Prompt tools">
                  <button class="send-button" type="submit" aria-label="送出">↑</button>
                </div>
              </div>
            </form>
          </div>
        </section>
      </section>

      <aside class="knowledge-panel is-collapsed" id="knowledgePanel" aria-label="RAG files and settings">
        <div class="knowledge-content">
          <div class="knowledge-panel-head">
            <strong>文件</strong>
            <button class="panel-close-button" id="knowledgeClose" type="button" aria-label="收合文件選擇">×</button>
          </div>
          <div class="top-actions">
            <label class="language-picker">
              <span data-i18n="language">語言</span>
              <select id="languageSelect">
                <option value="zh-Hant" selected>中文</option>
                <option value="en">English</option>
              </select>
            </label>
            <label class="kb-picker">
              <span>知識庫</span>
              <select id="knowledgeBaseSelect" aria-label="Knowledge base"></select>
            </label>
          </div>
        <label class="file-search">
          <span>⌕</span>
          <input id="fileSearchInput" type="search" autocomplete="off" placeholder="搜尋文件名稱..." />
        </label>
        <div class="folder-toolbar">
          <label class="upload-folder-picker">
            <span>上傳到</span>
            <select id="uploadFolderSelect" aria-label="上傳目的資料夾"></select>
          </label>
          <div class="folder-actions" aria-label="資料夾管理">
            <button id="newFolderButton" type="button" title="新增資料夾" aria-label="新增資料夾">＋</button>
            <button id="renameFolderButton" type="button" title="重新命名資料夾" aria-label="重新命名資料夾">✎</button>
            <button id="deleteFolderButton" type="button" title="刪除資料夾" aria-label="刪除資料夾">⌫</button>
          </div>
        </div>
        <p class="upload-status" id="documentUploadStatus" role="status" hidden></p>

        <section class="file-list-section" id="fileListSection">
          <div class="file-list-head">
            <h2>文件列表 <span id="selectedDocCount">(0)</span></h2>
            <div class="doc-actions">
              <input
                id="documentInput"
                type="file"
                accept=".pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff,.bmp,.heic,.docx,.txt,.md,.markdown,.json,application/pdf,image/*,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown,application/json"
                multiple
                hidden
              />
              <button
                class="upload-document-button"
                type="button"
                id="uploadDocument"
                title="上傳 PDF、圖片、DOCX、TXT、MD 或 JSON"
                aria-label="上傳文件"
              ><span aria-hidden="true">↑</span></button>
              <button type="button" id="selectAllDocuments" data-i18n="selectAll">全選</button>
              <button type="button" id="clearDocuments" data-i18n="clear">清除選擇</button>
            </div>
          </div>
          <div class="document-list" id="documentList"></div>
        </section>

        <details class="advanced-panel">
          <summary>進階設定</summary>
          <div class="variant-details" id="variantDetails" hidden></div>
          <div class="agent-controls">
            <input
              id="agentEndpointInput"
              type="url"
              autocomplete="off"
              placeholder="https://your-agent.example.com/agent/query"
            />
            <div class="agent-buttons">
              <button type="button" id="saveAgentEndpoint">Save</button>
              <button type="button" id="askAgentButton">Ask Agent</button>
            </div>
          </div>
          <div id="graphPanel" hidden></div>
        </details>
        </div>
      </aside>
    </main>

    <dialog class="confirm-dialog" id="deleteConversationDialog" aria-labelledby="deleteConversationTitle">
      <form method="dialog">
        <h2 id="deleteConversationTitle">刪除對話</h2>
        <p id="deleteConversationMessage"></p>
        <div class="confirm-dialog-actions">
          <button class="dialog-cancel-button" type="submit" value="cancel">取消</button>
          <button class="dialog-delete-button" type="submit" value="confirm">刪除</button>
        </div>
      </form>
    </dialog>

    <dialog class="confirm-dialog folder-dialog" id="folderDialog" aria-labelledby="folderDialogTitle">
      <form method="dialog">
        <h2 id="folderDialogTitle">新增資料夾</h2>
        <label class="folder-name-field">
          <span>資料夾名稱</span>
          <input id="folderNameInput" type="text" maxlength="80" autocomplete="off" />
        </label>
        <p class="dialog-error" id="folderDialogError" hidden></p>
        <div class="confirm-dialog-actions">
          <button class="dialog-cancel-button" type="submit" value="cancel">取消</button>
          <button class="dialog-save-button" id="saveFolderButton" type="button">儲存</button>
        </div>
      </form>
    </dialog>

    <dialog class="confirm-dialog" id="deleteFolderDialog" aria-labelledby="deleteFolderTitle">
      <form method="dialog">
        <h2 id="deleteFolderTitle">刪除資料夾</h2>
        <p id="deleteFolderMessage"></p>
        <p>資料不會被刪除，文件會移到「未分類」。</p>
        <div class="confirm-dialog-actions">
          <button class="dialog-cancel-button" type="submit" value="cancel">取消</button>
          <button class="dialog-delete-button" id="confirmDeleteFolderButton" type="button">刪除</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./assets/app.js?v=canonical-pipeline-1"></script>
  </body>
</html>
